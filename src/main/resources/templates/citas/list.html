<!DOCTYPE html>

<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    layout:decorate="~{layout/layout}">

<head>
    <title th:text="${titulo}"></title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <!--Contenido de la Página-->
    <div layout:fragment="contenido" class="contenido">
        <section class="container bg-fp-secondary p-4 rounded-4 shadow shadow-4 mb-2 mt-4">

            <div class="container-titulo">
                <h3>Listado de Citas</h3>
            </div>
            <hr>
            <div class="container-tabla">
                <table id="tablaCitas" class="table table-striped table-hover table-bordered table-sm"
                    style="width: 100%;">
                    <thead class="table-warning">
                        <!-- Tablas -->
                        <tr class="text-center">
                            <th>ID</th>
                            <th>DNI</th>
                            <th>Paciente</th>
                            <th>Médico</th>
                            <th>Especialidad</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ct : ${citas}" class="text-center">
                            <td th:text="${ct.id}"></td>
                            <td th:text="${ct.paciente.dni}"></td>
                            <td th:text="${ct.paciente.apellido} + ', ' +${ct.paciente.nombre}"></td>
                            <td th:text="${ct.medico.apellido}+ ', ' + ${ct.medico.nombre}"></td>
                            <td th:text="${ct.medico.especialidad}"></td>
                            <td th:text="${ct.fecha}"></td>
                            <td th:text="${ct.hora}"></td>
                            <td th:text="${ct.estado}" th:class="${#strings.trim(ct.estado) == 'PENDIENTE' ? 'bg-warning fw-bold text-light' : 
                            #strings.trim(ct.estado) == 'CONFIRMADA' ? 'bg-success fw-bold text-light' : 
                            #strings.trim(ct.estado) == 'COMPLETADA' ? 'bg-secondary fw-bold text-light' : 
                            'bg-danger fw-bold text-light'}"></td>
                            <td>
                                <!-- Editar -->
                                <button th:onclick="editar([[${ct.id}]])"
                                    class="btn btn-outline-warning float-end shadow rounded border border-1 border-warning ms-2"
                                    data-bs-toggle="tooltip" data-bs-placement="botton" title="Editar cita">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <!-- Cancelar -->
                                <button th:onclick="cancelar([[${ct.id}]])"
                                    class="btn btn-outline-danger float-end shadow rounded border border-1 border-danger ms-2"
                                    data-bs-toggle="tooltip" data-bs-placement="botton" title="Cancelar cita">
                                    <i class="fa-solid fa-calendar-xmark"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!--Script de la Página-->
    <script th:src="@{/js/citas.js}" th:fragment="js"></script>
</body>

</html>
