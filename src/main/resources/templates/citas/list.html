<!DOCTYPE html>

<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    layout:decorate="~{layout/layout}">

<head>
    <title th:text="${titulo}"></title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <!--Contenido de la Página-->
    <div layout:fragment="contenido" class="contenido">
        <section class="container bg-fp-secondary p-4 rounded-4 shadow shadow-4 mb-2 mt-4">

            <div class="container-titulo">
                <h3>Listado de Citas</h3>
            </div>
            <hr>
            <div class="container-tabla">
                <table id="tablaCitas" class="table table-striped table-hover table-bordered table-sm"
                    style="width: 100%;">
                    <thead>

                        <!-- Tablas -->
                        <tr>
                            <th>ID</th>
                            <th>Paciente</th>
                            <th>Medico</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ct : ${citas}">
                            <td th:text="${ct.id}"></td>
                            <td th:text="${ct.paciente}"></td>
                            <td th:text="${ct.medico}"></td>
                            <td th:text="${ct.fecha}"></td>
                            <td th:text="${ct.hora}"></td>
                            <td th:text="${ct.estado}"></td>
                            <td>
                                <button>Test</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!--Script de la Página-->
    <script th:src="@{/js/citas.js}" th:fragment="js"></script>
</body>

</html>
